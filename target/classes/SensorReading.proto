syntax = "proto3";

package com.example.iggy.flink.example.proto;

option java_package = "com.example.iggy.flink.example.proto";
option java_outer_classname = "SensorReadingProtos";
option java_multiple_files = true;

message SensorReading {
  string sensor_id = 1;
  double value = 2;
  string unit = 3;
  int64 timestamp = 4;
}
