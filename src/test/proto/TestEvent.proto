syntax = "proto3";

package com.example.iggy.flink.test.proto;

option java_package = "com.example.iggy.flink.test.proto";
option java_outer_classname = "TestEventProtos";
option java_multiple_files = true;

message TestEvent {
  string id = 1;
  string name = 2;
  double value = 3;
  int64 timestamp = 4;
}
